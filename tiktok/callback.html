<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connected</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<h1 id="h">Connecting…</h1>
<p id="p" class="muted">Monstah Uploads sign-in return page.</p>
<nav><a href="../privacy.html">Privacy policy</a><a href="../terms.html">Terms of service</a></nav>
</main>
<script>
  // The sign-in code stays in this page's address for the August Works tool to read.
  // Nothing is sent anywhere from this page.
  const q = new URLSearchParams(location.search);
  if (q.get('code')) {
    document.getElementById('h').textContent = 'Connected';
    document.getElementById('p').textContent = 'Click Copy code, paste it into the terminal, then close this tab.';
    const b = document.createElement('button');
    b.textContent = 'Copy code';
    b.style.cssText = 'font:inherit;padding:.6em 1.2em;margin:.5em 0 1em;cursor:pointer';
    b.onclick = async () => { await navigator.clipboard.writeText(location.href); b.textContent = 'Copied'; };
    document.getElementById('p').after(b);
  } else if (q.get('error')) {
    document.getElementById('h').textContent = 'Not connected';
    document.getElementById('p').textContent = q.get('error_description') || q.get('error');
  }
</script>
</body>
</html>
